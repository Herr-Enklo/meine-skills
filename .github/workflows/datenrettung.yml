name: Datenrettung

on:
  push:
    paths:
      - "datenrettung/**"
      - ".github/workflows/datenrettung.yml"
  pull_request:
    paths:
      - "datenrettung/**"
      - ".github/workflows/datenrettung.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Statische Pruefung
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes datenrettung
      - name: Engine- und Regressionstests
        run: python -m unittest discover -s datenrettung/tests -t . -v
      - name: Oberflaeche unter Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a python -m unittest datenrettung.tests.test_gui -v
      - name: Windows-Geraete (Groesse, Sektorgroesse, Laufwerksliste)
        if: runner.os == 'Windows'
        run: python datenrettung/tests/windows_geraete.py
