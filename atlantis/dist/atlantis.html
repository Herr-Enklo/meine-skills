<script>
/* Bedienoberfläche: Verben, Inventar, Satzzeile, Menü, Tagebuch, Speichern. */
(function (ATL) {
  const U = ATL.U;
  const $ = (s) => document.querySelector(s);
  const SLOTS = 6;

  class UI {
    constructor(g) {
      this.g = g; g.ui = this;
      this.invPage = 0;
      this.dialogResolve = null;
      this.toastTimer = null;
      this.menuOpen = false;
      this.diaryOpen = false;
      this.muted = false;
      this.bind();
      this.resize();
      window.addEventListener('resize', () => this.resize());
      g.onActionDone = () => this.autosave();
    }
    resize() {
      const sw = window.innerWidth / 960, sh = window.innerHeight / 750;
      const s = Math.min(sw, sh);
      $('#frame').style.transform = `translate(-50%, -50%) scale(${s})`;
    }
    bind() {
      const g = this.g;
      const canvas = $('#scene');
      const pos = (ev) => {
        const r = canvas.getBoundingClientRect();
        return [((ev.clientX - r.left) / r.width) * 960, ((ev.clientY - r.top) / r.height) * 600];
      };
      canvas.addEventListener('mousemove', (ev) => {
        const [x, y] = pos(ev);
        if (!g.roomDef) return;
        g.hover = g.hotspotAt(x + g.camera, y);
        this.updateSentence();
        canvas.style.cursor = g.hover ? 'pointer' : 'crosshair';
      });
      canvas.addEventListener('mouseleave', () => { g.hover = null; this.updateSentence(); });
      canvas.addEventListener('click', (ev) => { ATL.audio.unlock(); const [x, y] = pos(ev); g.clickScene(x, y, false); });
      canvas.addEventListener('contextmenu', (ev) => { ev.preventDefault(); ATL.audio.unlock(); const [x, y] = pos(ev); g.clickScene(x, y, true); });
      document.querySelectorAll('#verbs button').forEach((b) => {
        b.addEventListener('click', () => { ATL.audio.unlock(); if (g.cutscene || g.inDialog) return; g.selectVerb(b.dataset.verb); this.updateSentence(); });
      });
      $('#inv-up').addEventListener('click', () => { this.invPage = Math.max(0, this.invPage - 1); this.refreshInventory(); });
      $('#inv-down').addEventListener('click', () => { this.invPage++; this.refreshInventory(); });
      $('#btn-menu').addEventListener('click', () => this.toggleMenu());
      $('#btn-diary').addEventListener('click', () => this.toggleDiary());
      $('#diary-close').addEventListener('click', () => this.toggleDiary(false));
      document.querySelectorAll('.diary-tabs button[data-tab]').forEach((b) => b.addEventListener('click', () => this.showDiary(b.dataset.tab)));
      window.addEventListener('keydown', (ev) => {
        if (ev.target && ev.target.tagName === 'INPUT') return;
        if (ev.key === 'Escape') {
          if (this.diaryOpen) { this.toggleDiary(false); return; }
          if ($('#overlay').classList.contains('hidden')) this.toggleMenu();
          return;
        }
        if (this.menuOpen || this.diaryOpen) return;
        if (ev.key === ' ' || ev.key === 'Enter' || ev.key === '.') { ev.preventDefault(); g.skip(); return; }
        if (ev.key === 't' || ev.key === 'T') { this.toggleDiary(); return; }
        const map = { g: 'give', o: 'open', s: 'close', n: 'take', a: 'look', r: 'talk', b: 'use', d: 'push', z: 'pull' };
        if (map[ev.key] && !g.cutscene && !g.inDialog) { g.selectVerb(map[ev.key]); this.updateSentence(); }
        if (g.inDialog && /^[1-9]$/.test(ev.key)) {
          const opts = document.querySelectorAll('#dialog .opt');
          const o = opts[parseInt(ev.key, 10) - 1];
          if (o) o.click();
        }
      });
    }
    setRoomName(n) { document.title = n ? n + ' – Die Siegel von Atlantis' : 'Die Siegel von Atlantis'; }
    updateSentence() {
      const g = this.g;
      if (g.cutscene || g.inDialog) { $('#sentence').innerHTML = '&nbsp;'; return; }
      $('#sentence').textContent = g.roomDef ? g.sentence() : '';
    }
    refreshVerbs() {
      const g = this.g;
      document.querySelectorAll('#verbs button').forEach((b) => b.classList.toggle('active', b.dataset.verb === g.verb));
      document.querySelectorAll('.inv-item').forEach((e) => e.classList.toggle('selected', e.dataset.item === g.item));
      this.updateSentence();
    }
    refreshInventory() {
      const g = this.g;
      const grid = $('#inv-grid');
      grid.innerHTML = '';
      if (!g.state) return;
      const inv = g.state.inv;
      const per = 12;
      const pages = Math.max(1, Math.ceil(inv.length / per));
      if (this.invPage >= pages) this.invPage = pages - 1;
      $('#inv-up').disabled = this.invPage === 0;
      $('#inv-down').disabled = this.invPage >= pages - 1;
      const slice = inv.slice(this.invPage * per, this.invPage * per + per);
      for (const id of slice) {
        const it = ATL.items.get(id);
        if (!it) continue;
        const cv = document.createElement('canvas');
        cv.width = 48; cv.height = 48;
        const painter = ATL.icons[it.icon || id] || ATL.icons.default;
        try { painter(cv.getContext('2d'), it); } catch (e) { /* Icon fehlt */ }
        const el = U.el('div', { class: 'inv-item' + (g.item === id ? ' selected' : ''), title: it.name, 'data-item': id }, [cv]);
        el.addEventListener('mouseenter', () => { g.hover = { name: it.name, kind: 'item', id }; this.updateSentence(); });
        el.addEventListener('mouseleave', () => { g.hover = null; this.updateSentence(); });
        el.addEventListener('click', () => { ATL.audio.unlock(); g.clickItem(id); });
        el.addEventListener('contextmenu', (ev) => { ev.preventDefault(); g.verb = 'look'; g.item = null; g.useItem('look', id); });
        grid.appendChild(el);
      }
    }
    setCutscene(on) {
      $('#panel').style.opacity = on ? 0.35 : 1;
      for (const sel of ['#verbs', '#inventory', '#sentence']) $(sel).style.pointerEvents = on ? 'none' : 'auto';
      this.updateSentence();
    }
    showDialogPanel() {
      $('#verbs').classList.add('hidden');
      $('#inventory').classList.add('hidden');
      $('#dialog').classList.remove('hidden');
      $('#dialog').innerHTML = '';
      $('#sentence').innerHTML = '&nbsp;';
    }
    chooseOption(texts) {
      const box = $('#dialog');
      box.innerHTML = '';
      return new Promise((resolve) => {
        texts.forEach((t, i) => {
          const el = U.el('div', { class: 'opt', text: t });
          el.addEventListener('click', () => { box.innerHTML = ''; resolve(i); });
          box.appendChild(el);
        });
      });
    }
    hideDialog() {
      $('#dialog').classList.add('hidden');
      $('#dialog').innerHTML = '';
      $('#verbs').classList.remove('hidden');
      $('#inventory').classList.remove('hidden');
    }
    toast(text) {
      const t = $('#toast');
      t.textContent = text; t.classList.remove('hidden');
      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => t.classList.add('hidden'), 3200);
    }

    // ---------- Menü ----------
    toggleMenu(force) {
      this.menuOpen = force === undefined ? !this.menuOpen : force;
      $('#menu').classList.toggle('hidden', !this.menuOpen);
      $('#menu').classList.toggle('title-mode', !!(this.g.roomDef && this.g.roomDef.id === 'title'));
      if (this.menuOpen) this.renderMenu();
    }
    renderMenu(mode) {
      const g = this.g;
      const bt = $('#menu-buttons');
      const slots = $('#menu-slots');
      bt.innerHTML = ''; slots.innerHTML = ''; slots.classList.add('hidden');
      const inGame = !!(g.state && g.roomDef && g.roomDef.id !== 'title');
      const add = (label, fn, disabled) => { const b = U.el('button', { text: label }); b.disabled = !!disabled; b.addEventListener('click', fn); bt.appendChild(b); return b; };
      if (mode === 'save' || mode === 'load') {
        slots.classList.remove('hidden');
        const list = this.listSaves();
        for (let i = 0; i < SLOTS; i++) {
          const s = list[i];
          const label = (i + 1) + '. ' + (s ? `${s.roomName} – ${new Date(s.saved).toLocaleString('de-DE')}` : 'leer');
          const b = U.el('button', { text: label });
          if (mode === 'load' && !s) b.disabled = true;
          b.addEventListener('click', async () => {
            if (mode === 'save') { this.save(i); this.toast('Gespeichert.'); this.toggleMenu(false); }
            else { this.toggleMenu(false); await g.restore(s); }
          });
          slots.appendChild(b);
        }
        add('Zurück', () => this.renderMenu());
        return;
      }
      add('Neues Spiel', async () => { this.toggleMenu(false); await ATL.story.newGame(g); });
      const auto = this.loadSlot('auto');
      add(inGame ? 'Weiterspielen' : 'Fortsetzen', async () => { this.toggleMenu(false); if (!inGame && auto) await g.restore(auto); }, !inGame && !auto);
      add('Speichern', () => this.renderMenu('save'), !inGame || g.cutscene || g.inDialog);
      add('Laden', () => this.renderMenu('load'), !this.listSaves().some(Boolean));
      add(ATL.audio.muted ? 'Ton einschalten' : 'Ton ausschalten', () => { ATL.audio.unlock(); ATL.audio.toggleMute(); this.renderMenu(); });
      add('Über das Spiel', () => this.about());
    }
    about() {
      const bt = $('#menu-buttons');
      bt.innerHTML = '';
      bt.appendChild(U.el('div', { style: 'text-align:left;font-size:15px;line-height:1.45;color:#d8c8a0', html:
        '<p>Ein Abenteuerspiel im Stil der klassischen Zeigen-und-Klicken-Spiele der frühen 1990er. Alle Grafiken werden im Browser aus Formen gezeichnet, es gibt keine Bilddateien.</p>' +
        '<p>Die Mythen und Kulturen im Spiel (Platons Atlantis, Solon in Sais, Thot und Maat, das Labyrinth von Knossos, die Sintflut des Gilgamesch-Epos, die Apkallu, der Ausbruch von Thera) sind im Kodex kurz und ohne Ausschmückung erklärt. Die Handlung selbst ist erfunden.</p>' +
        '<p>Tastatur: Leertaste überspringt Text, Esc öffnet das Menü, T das Tagebuch, Ziffern wählen Gesprächsoptionen.</p>' }));
      const b = U.el('button', { text: 'Zurück' }); b.addEventListener('click', () => this.renderMenu()); bt.appendChild(b);
    }

    // ---------- Speichern ----------
    key(i) { return 'atl.save.' + i; }
    loadSlot(i) { try { const s = localStorage.getItem(this.key(i)); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
    listSaves() { const out = []; for (let i = 0; i < SLOTS; i++) out.push(this.loadSlot(i)); return out; }
    save(i) { try { localStorage.setItem(this.key(i), JSON.stringify(this.g.snapshot())); } catch (e) { this.toast('Speichern nicht möglich.'); } }
    autosave() {
      const g = this.g;
      if (!g.state || !g.roomDef || g.roomDef.id === 'title' || g.cutscene || g.inDialog || g.roomDef.noSave) return;
      try { localStorage.setItem(this.key('auto'), JSON.stringify(g.snapshot())); } catch (e) { /* voll */ }
    }

    // ---------- Tagebuch ----------
    toggleDiary(force) {
      this.diaryOpen = force === undefined ? !this.diaryOpen : force;
      $('#diary').classList.toggle('hidden', !this.diaryOpen);
      if (this.diaryOpen) this.showDiary('ziele');
    }
    showDiary(tab) {
      const g = this.g;
      document.querySelectorAll('.diary-tabs button[data-tab]').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
      const c = $('#diary-content');
      c.innerHTML = '';
      if (!g.state) { c.textContent = 'Kein Spiel geladen.'; return; }
      if (tab === 'ziele') {
        const list = g.state.objectives;
        if (!list.length) { c.textContent = 'Noch keine Einträge.'; return; }
        c.appendChild(U.el('h3', { text: 'Aktuelle Aufgabe' }));
        const cur = list.filter((o) => !o.done);
        if (cur.length) cur.forEach((o) => c.appendChild(U.el('p', { class: 'now', text: o.text })));
        else c.appendChild(U.el('p', { text: 'Nichts Offenes.' }));
        const done = list.filter((o) => o.done);
        if (done.length) {
          c.appendChild(U.el('h3', { text: 'Erledigt' }));
          done.slice().reverse().forEach((o) => c.appendChild(U.el('p', { class: 'done', text: o.text })));
        }
      } else {
        const ids = g.state.codex;
        if (!ids.length) { c.textContent = 'Der Kodex ist noch leer. Er füllt sich, wenn Falk auf Spuren alter Mythen stößt.'; return; }
        for (const id of ids) {
          const e = ATL.codex[id];
          if (!e) continue;
          const d = U.el('div', { class: 'kodex-entry' });
          d.appendChild(U.el('h3', { text: e.title }));
          if (e.origin) d.appendChild(U.el('small', { text: e.origin }));
          e.text.split('\n').forEach((p) => d.appendChild(U.el('p', { text: p })));
          c.appendChild(d);
        }
      }
    }
  }

  ATL.UI = UI;
})(window.ATL);

</script>
<script>
/* Rätsel-Einblendungen: Ringschloss, Labyrinth, Faustkampf, Symbolschloss,
   Zettelkasten, Keilschrift, Schriftstücke. Jede Funktion liefert ein Promise. */
(function (ATL) {
  const U = ATL.U;
  const A = ATL.A;
  const P = {};
  const $ = (s) => document.querySelector(s);

  function open(g, build) {
    const ov = $('#overlay');
    ov.innerHTML = '';
    ov.classList.remove('hidden');
    const box = U.el('div', { class: 'box' });
    ov.appendChild(box);
    return new Promise((resolve) => {
      const close = (v) => { ov.classList.add('hidden'); ov.innerHTML = ''; resolve(v); };
      build(box, close);
    });
  }
  P.open = open;

  // ---------- Symbole für das Ringschloss ----------
  const SYMBOLS = [
    { id: 'sonne', name: 'Sonne', riddle: 'zur Sonne selbst', draw: (c, x, y, r) => { A.circle(c, x, y, r * 0.4, c.fillStyle); for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; A.line(c, x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55, x + Math.cos(a) * r * 0.9, y + Math.sin(a) * r * 0.9, c.fillStyle, 2); } } },
    { id: 'mond', name: 'Mond', riddle: 'zur Schwester der Sonne, die nachts wandert', draw: (c, x, y, r) => { A.circle(c, x, y, r * 0.75, c.fillStyle); const f = c.fillStyle; A.circle(c, x + r * 0.35, y - r * 0.15, r * 0.6, '#1a130c'); c.fillStyle = f; } },
    { id: 'welle', name: 'Welle', riddle: 'dorthin, wo das Meer sich hebt', draw: (c, x, y, r) => { c.strokeStyle = c.fillStyle; c.lineWidth = 2.5; for (let k = -1; k <= 1; k++) { c.beginPath(); for (let i = 0; i <= 10; i++) { const px = x - r * 0.8 + i / 10 * r * 1.6, py = y + k * r * 0.4 + Math.sin(i * 1.3) * r * 0.15; i ? c.lineTo(px, py) : c.moveTo(px, py); } c.stroke(); } } },
    { id: 'berg', name: 'Berg', riddle: 'dorthin, wo die Erde den Himmel berührt', draw: (c, x, y, r) => { A.poly(c, [x - r * 0.85, y + r * 0.6, x - r * 0.2, y - r * 0.7, x + r * 0.3, y, x + r * 0.55, y - r * 0.3, x + r * 0.9, y + r * 0.6], c.fillStyle); } },
    { id: 'stern', name: 'Stern', riddle: 'zum Licht, das nachts den Seefahrer führt', draw: (c, x, y, r) => { const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i / 10 * Math.PI * 2; const rr = i % 2 ? r * 0.35 : r * 0.85; p.push(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } A.poly(c, p, c.fillStyle); } },
    { id: 'auge', name: 'Auge', riddle: 'zum Auge, das niemals schläft', draw: (c, x, y, r) => { c.strokeStyle = c.fillStyle; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x - r * 0.85, y); c.quadraticCurveTo(x, y - r * 0.9, x + r * 0.85, y); c.quadraticCurveTo(x, y + r * 0.9, x - r * 0.85, y); c.stroke(); A.circle(c, x, y, r * 0.28, c.fillStyle); } },
    { id: 'spirale', name: 'Spirale', riddle: 'zum Wirbel, der alles verschlingt', draw: (c, x, y, r) => { c.strokeStyle = c.fillStyle; c.lineWidth = 2.5; c.beginPath(); for (let a = 0; a < Math.PI * 5; a += 0.15) { const rr = a / (Math.PI * 5) * r * 0.85; const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; a ? c.lineTo(px, py) : c.moveTo(px, py); } c.stroke(); } },
    { id: 'dreizack', name: 'Dreizack', riddle: 'zur Waffe des Erderschütterers', draw: (c, x, y, r) => { A.line(c, x, y + r * 0.9, x, y - r * 0.4, c.fillStyle, 3); c.strokeStyle = c.fillStyle; c.lineWidth = 3; c.beginPath(); c.moveTo(x - r * 0.6, y - r * 0.2); c.lineTo(x - r * 0.6, y - r * 0.8); c.moveTo(x + r * 0.6, y - r * 0.2); c.lineTo(x + r * 0.6, y - r * 0.8); c.moveTo(x, y - r * 0.4); c.lineTo(x, y - r * 0.95); c.moveTo(x - r * 0.6, y - r * 0.2); c.quadraticCurveTo(x, y + r * 0.3, x + r * 0.6, y - r * 0.2); c.stroke(); } },
  ];
  P.SYMBOLS = SYMBOLS;

  // Ringschloss: drei Ringe, jeder muss auf ein bestimmtes Symbol zeigen
  P.dial = function (g, opts) {
    if (g.fast) return Promise.resolve(true);
    const sol = opts.solution; // [outer, middle, inner] als Indizes in SYMBOLS
    const rot = [0, 0, 0];
    const names = ['Sonne', 'Stier', 'Flut'];
    return open(g, (box, close) => {
      box.appendChild(U.el('h2', { text: opts.title || 'Das Tor der drei Siegel' }));
      box.appendChild(U.el('p', { text: opts.hint || 'Klick auf einen Ring dreht ihn im Uhrzeigersinn, Rechtsklick dagegen. Der Zeiger oben markiert die Lesestelle.' }));
      const cv = U.el('canvas', { width: 440, height: 440 });
      box.appendChild(cv);
      const row = U.el('div', { class: 'row' });
      const bq = U.el('button', { text: 'Zurücktreten' });
      bq.addEventListener('click', () => close(false));
      row.appendChild(bq);
      box.appendChild(row);
      const c = cv.getContext('2d');
      const cx = 220, cy = 220;
      const radii = [[200, 150], [145, 95], [90, 40]];
      const colors = ['#8a7350', '#7a6248', '#6a5540'];
      let solved = false;
      const draw = () => {
        c.clearRect(0, 0, 440, 440);
        A.circle(c, cx, cy, 212, '#1d160e');
        for (let ring = 0; ring < 3; ring++) {
          const [ro, ri] = radii[ring];
          c.fillStyle = A.rgrad(c, cx, cy, ri, ro, [A.shade(colors[ring], -0.2), colors[ring], A.shade(colors[ring], -0.3)]);
          c.beginPath(); c.arc(cx, cy, ro, 0, Math.PI * 2); c.arc(cx, cy, ri, 0, Math.PI * 2, true); c.fill();
          c.strokeStyle = '#2a2016'; c.lineWidth = 2;
          c.beginPath(); c.arc(cx, cy, ro, 0, Math.PI * 2); c.stroke();
          const rm = (ro + ri) / 2;
          for (let i = 0; i < 8; i++) {
            const a = -Math.PI / 2 + ((i + rot[ring]) / 8) * Math.PI * 2;
            const sx = cx + Math.cos(a) * rm, sy = cy + Math.sin(a) * rm;
            const ok = solved && i === sol[ring];
            c.fillStyle = ok ? '#ffe28a' : '#e6cf98';
            SYMBOLS[i].draw(c, sx, sy, (ro - ri) * 0.32);
          }
          A.seal(c, cx, cy, 36, 'flood', '#d8b04a');
        }
        // Siegel in den Ringen anzeigen (Beschriftung)
        c.fillStyle = '#f1d998'; c.font = '13px Georgia'; c.textAlign = 'center';
        for (let ring = 0; ring < 3; ring++) c.fillText(names[ring], cx, cy + radii[ring][1] + 12);
        // Zeiger
        A.poly(c, [cx - 12, 8, cx + 12, 8, cx, 30], solved ? '#ffe28a' : '#e0b84a');
        if (solved) { c.fillStyle = '#ffe28a'; c.font = '20px Georgia'; c.fillText('Die Ringe rasten ein.', cx, 432); }
      };
      draw();
      const ringAt = (x, y) => {
        const d = Math.hypot(x - cx, y - cy);
        for (let r = 0; r < 3; r++) if (d <= radii[r][0] && d >= radii[r][1]) return r;
        return -1;
      };
      const handle = (ev, dirn) => {
        ev.preventDefault();
        if (solved) return;
        const rect = cv.getBoundingClientRect();
        const x = ((ev.clientX - rect.left) / rect.width) * 440, y = ((ev.clientY - rect.top) / rect.height) * 440;
        const r = ringAt(x, y);
        if (r < 0) return;
        rot[r] = (rot[r] + dirn + 8) % 8;
        ATL.audio.fx('click');
        // Symbol an der Lesestelle (oben): Index i mit (i + rot) % 8 === 0
        const reading = rot.map((rr) => (8 - rr) % 8);
        draw();
        if (reading.every((v, i) => v === sol[i])) {
          solved = true; ATL.audio.fx('stone'); draw();
          setTimeout(() => close(true), 1400);
        }
      };
      cv.addEventListener('click', (ev) => handle(ev, 1));
      cv.addEventListener('contextmenu', (ev) => handle(ev, -1));
    });
  };

  // ---------- Labyrinth ----------
  function genMaze(w, h, seed) {
    const r = U.rng(seed);
    const cells = [];
    for (let y = 0; y < h; y++) { cells.push([]); for (let x = 0; x < w; x++) cells[y].push({ n: true, s: true, e: true, w: true, v: false }); }
    const stack = [[0, Math.floor(h / 2)]];
    cells[Math.floor(h / 2)][0].v = true;
    while (stack.length) {
      const [x, y] = stack[stack.length - 1];
      const nb = [];
      if (y > 0 && !cells[y - 1][x].v) nb.push([x, y - 1, 'n', 's']);
      if (y < h - 1 && !cells[y + 1][x].v) nb.push([x, y + 1, 's', 'n']);
      if (x > 0 && !cells[y][x - 1].v) nb.push([x - 1, y, 'w', 'e']);
      if (x < w - 1 && !cells[y][x + 1].v) nb.push([x + 1, y, 'e', 'w']);
      if (!nb.length) { stack.pop(); continue; }
      const [nx, ny, a, b] = nb[Math.floor(r() * nb.length)];
      cells[y][x][a] = false; cells[ny][nx][b] = false; cells[ny][nx].v = true;
      stack.push([nx, ny]);
    }
    return cells;
  }
  P.maze = function (g, opts) {
    if (g.fast) return Promise.resolve(true);
    opts = opts || {};
    const W = 15, H = 11, CS = 34;
    const cells = genMaze(W, H, opts.seed || 4242);
    const start = [0, Math.floor(H / 2)];
    const goal = opts.goal || [Math.floor(W / 2), Math.floor(H / 2)];
    let px = start[0], py = start[1];
    const seen = new Set([px + ',' + py]);
    const trail = [[px, py]];
    const hasThread = !!opts.thread;
    let steps = 0;
    return open(g, (box, close) => {
      box.appendChild(U.el('h2', { text: 'Das Labyrinth' }));
      box.appendChild(U.el('p', { text: hasThread ? 'Der Faden markiert den Weg zurück. Pfeiltasten oder Klick auf ein Nachbarfeld. Finde die Halle in der Mitte.' : 'Ohne Faden verliert man hier schnell die Orientierung. Pfeiltasten oder Klick auf ein Nachbarfeld.' }));
      const cv = U.el('canvas', { width: W * CS + 20, height: H * CS + 20 });
      box.appendChild(cv);
      const row = U.el('div', { class: 'row' });
      const bq = U.el('button', { text: 'Umkehren und hinausgehen' });
      bq.addEventListener('click', () => { window.removeEventListener('keydown', onKey); close(false); });
      row.appendChild(bq);
      box.appendChild(row);
      const c = cv.getContext('2d');
      const draw = () => {
        c.fillStyle = '#0b0805'; c.fillRect(0, 0, cv.width, cv.height);
        const ox = 10, oy = 10;
        const R = hasThread ? 3 : 2;
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
          const d = Math.max(Math.abs(x - px), Math.abs(y - py));
          const vis = d <= R || (hasThread && seen.has(x + ',' + y));
          if (!vis) continue;
          const alpha = d <= R ? 1 - d * 0.2 : 0.35;
          const X = ox + x * CS, Y = oy + y * CS;
          c.fillStyle = `rgba(90,72,50,${alpha * 0.55})`; c.fillRect(X, Y, CS, CS);
          c.strokeStyle = `rgba(210,180,130,${alpha})`; c.lineWidth = 3;
          const cell = cells[y][x];
          c.beginPath();
          if (cell.n) { c.moveTo(X, Y); c.lineTo(X + CS, Y); }
          if (cell.s) { c.moveTo(X, Y + CS); c.lineTo(X + CS, Y + CS); }
          if (cell.w) { c.moveTo(X, Y); c.lineTo(X, Y + CS); }
          if (cell.e) { c.moveTo(X + CS, Y); c.lineTo(X + CS, Y + CS); }
          c.stroke();
          if (x === goal[0] && y === goal[1]) { c.fillStyle = `rgba(255,200,80,${alpha})`; A.circle(c, X + CS / 2, Y + CS / 2, 8, c.fillStyle); }
        }
        if (hasThread && trail.length > 1) {
          c.strokeStyle = '#e8d8b0'; c.lineWidth = 2; c.beginPath();
          trail.forEach(([x, y], i) => { const X = ox + x * CS + CS / 2, Y = oy + y * CS + CS / 2; i ? c.lineTo(X, Y) : c.moveTo(X, Y); });
          c.stroke();
        }
        A.circle(c, ox + px * CS + CS / 2, oy + py * CS + CS / 2, 9, '#f0d090');
        A.circle(c, ox + px * CS + CS / 2, oy + py * CS + CS / 2, 4, '#6b4a2b');
        A.glow(c, ox + px * CS + CS / 2, oy + py * CS + CS / 2, CS * 2.2, 'rgba(255,170,80,0.5)', 0.35);
      };
      const move = (dx, dy) => {
        const cell = cells[py][px];
        if (dx === 1 && cell.e) return; if (dx === -1 && cell.w) return;
        if (dy === 1 && cell.s) return; if (dy === -1 && cell.n) return;
        const nx = px + dx, ny = py + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) return;
        px = nx; py = ny; steps++;
        ATL.audio.fx('step');
        const k = px + ',' + py;
        const idx = trail.findIndex(([x, y]) => x === px && y === py);
        if (idx >= 0) trail.length = idx + 1; else trail.push([px, py]);
        seen.add(k);
        draw();
        if (px === goal[0] && py === goal[1]) { window.removeEventListener('keydown', onKey); ATL.audio.fx('success'); setTimeout(() => close(true), 500); }
        else if (!hasThread && steps > 40 && Math.random() < 0.06) {
          window.removeEventListener('keydown', onKey);
          close('lost');
        }
      };
      const onKey = (ev) => {
        const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] };
        if (m[ev.key]) { ev.preventDefault(); ev.stopPropagation(); move(...m[ev.key]); }
      };
      window.addEventListener('keydown', onKey, true);
      cv.addEventListener('click', (ev) => {
        const rect = cv.getBoundingClientRect();
        const x = Math.floor((((ev.clientX - rect.left) / rect.width) * cv.width - 10) / CS);
        const y = Math.floor((((ev.clientY - rect.top) / rect.height) * cv.height - 10) / CS);
        const dx = x - px, dy = y - py;
        if (Math.abs(dx) + Math.abs(dy) === 1) move(dx, dy);
      });
      draw();
    });
  };

  // ---------- Faustkampf ----------
  P.fight = function (g, opts) {
    if (g.fast) return Promise.resolve(true);
    opts = opts || {};
    const enemyName = opts.enemy || 'Kessler';
    let hp = 100, ehp = opts.enemyHp || 100;
    const dmg = opts.damage || 22, edmg = opts.enemyDamage || 20;
    let state = 'idle'; // idle | windup | open
    let windSide = 'high';
    let timer = null;
    let msg = enemyName + ' geht in Stellung.';
    return open(g, (box, close) => {
      box.appendChild(U.el('h2', { text: 'Faustkampf gegen ' + enemyName }));
      box.appendChild(U.el('p', { text: 'Wenn er ausholt, blocke auf der richtigen Höhe. Nach einem Block ist er kurz offen: dann schlagen.' }));
      const cv = U.el('canvas', { width: 600, height: 240 });
      box.appendChild(cv);
      const row = U.el('div', { class: 'row' });
      const bHigh = U.el('button', { text: 'Block oben' });
      const bLow = U.el('button', { text: 'Block unten' });
      const bHit = U.el('button', { text: 'Schlag' });
      const bRun = U.el('button', { text: 'Zurückweichen' });
      [bHigh, bLow, bHit, bRun].forEach((b) => row.appendChild(b));
      box.appendChild(row);
      const c = cv.getContext('2d');
      const draw = () => {
        c.fillStyle = '#120d08'; c.fillRect(0, 0, 600, 240);
        A.rect(c, 40, 30, 200, 14, '#3a2a1a'); A.rect(c, 40, 30, 2 * Math.max(0, hp), 14, '#c9a86a');
        A.rect(c, 360, 30, 200, 14, '#3a2a1a'); A.rect(c, 360 + 200 - 2 * Math.max(0, ehp), 30, 2 * Math.max(0, ehp), 14, '#b34a3a');
        c.fillStyle = '#e6cf98'; c.font = '14px Georgia'; c.textAlign = 'left'; c.fillText('Falk', 40, 24); c.textAlign = 'right'; c.fillText(enemyName, 560, 24);
        // Figuren vereinfacht
        const drawFighter = (x, color, mirror, pose) => {
          c.save(); c.translate(x, 200); if (mirror) c.scale(-1, 1);
          A.rr(c, -18, -110, 36, 60, 8, color);
          A.circle(c, 0, -125, 14, '#e8b890');
          A.line(c, -8, -50, -12, 0, '#4a3a2a', 10); A.line(c, 8, -50, 12, 0, '#4a3a2a', 10);
          if (pose === 'high') A.line(c, 14, -100, 44, -128, color, 9);
          else if (pose === 'low') A.line(c, 14, -80, 44, -70, color, 9);
          else if (pose === 'blockhigh') A.line(c, 14, -100, 20, -135, color, 9);
          else if (pose === 'blocklow') A.line(c, 14, -80, 26, -60, color, 9);
          else if (pose === 'hit') A.line(c, 14, -95, 60, -100, color, 9);
          else A.line(c, 14, -95, 30, -75, color, 9);
          c.restore();
        };
        drawFighter(200, '#7a5230', false, S.playerPose);
        drawFighter(400, '#3a3a44', true, state === 'windup' ? windSide : state === 'stagger' ? 'low' : 'idle');
        c.fillStyle = '#f1d998'; c.font = '16px Georgia'; c.textAlign = 'center'; c.fillText(msg, 300, 225);
      };
      const S = { playerPose: 'idle' };
      const schedule = () => {
        clearTimeout(timer);
        state = 'idle';
        timer = setTimeout(() => {
          windSide = Math.random() < 0.5 ? 'high' : 'low';
          state = 'windup';
          msg = enemyName + ' holt aus: ' + (windSide === 'high' ? 'OBEN' : 'UNTEN') + '!';
          draw();
          timer = setTimeout(() => {
            if (state === 'windup') {
              hp -= edmg; ATL.audio.fx('punch');
              msg = 'Getroffen!';
              S.playerPose = 'idle';
              draw();
              if (hp <= 0) return finish(false);
              schedule();
            }
          }, 900);
        }, 700 + Math.random() * 900);
      };
      const finish = (won) => {
        clearTimeout(timer);
        msg = won ? enemyName + ' geht zu Boden.' : 'Falk geht zu Boden.';
        draw();
        setTimeout(() => close(won), 1200);
      };
      const block = (side) => {
        S.playerPose = side === 'high' ? 'blockhigh' : 'blocklow';
        if (state === 'windup' && side === windSide) {
          clearTimeout(timer);
          state = 'open';
          msg = 'Geblockt! Er ist offen!';
          ATL.audio.fx('click');
          draw();
          timer = setTimeout(() => { if (state === 'open') { msg = 'Zu langsam.'; S.playerPose = 'idle'; schedule(); draw(); } }, 900);
        } else draw();
      };
      bHigh.addEventListener('click', () => block('high'));
      bLow.addEventListener('click', () => block('low'));
      bHit.addEventListener('click', () => {
        S.playerPose = 'hit';
        if (state === 'open') {
          clearTimeout(timer);
          ehp -= dmg; ATL.audio.fx('punch');
          msg = 'Treffer!';
          state = 'stagger';
          draw();
          if (ehp <= 0) return finish(true);
          setTimeout(() => { S.playerPose = 'idle'; schedule(); draw(); }, 500);
        } else {
          msg = 'Ins Leere.';
          draw();
          setTimeout(() => { S.playerPose = 'idle'; draw(); }, 300);
        }
      });
      bRun.addEventListener('click', () => { clearTimeout(timer); close(false); });
      draw();
      schedule();
    });
  };

  // ---------- Symbolschloss: Blöcke durchklicken ----------
  P.symbols = function (g, opts) {
    if (g.fast) return Promise.resolve(true);
    const n = opts.solution.length;
    const cur = opts.start ? opts.start.slice() : new Array(n).fill(0);
    const syms = opts.symbols;
    return open(g, (box, close) => {
      box.appendChild(U.el('h2', { text: opts.title || 'Symbolschloss' }));
      if (opts.text) box.appendChild(U.el('p', { text: opts.text }));
      const row = U.el('div', { class: 'row' });
      const tiles = [];
      const cv = U.el('canvas', { width: 90 * n, height: 100 });
      box.appendChild(cv);
      const c = cv.getContext('2d');
      const draw = () => {
        c.clearRect(0, 0, cv.width, 100);
        for (let i = 0; i < n; i++) {
          A.rr(c, i * 90 + 8, 8, 74, 84, 6, '#3a2c1c', '#8a7350', 2);
          c.fillStyle = '#e6cf98';
          syms[cur[i]].draw(c, i * 90 + 45, 46, 26);
          c.fillStyle = '#a58a5c'; c.font = '12px Georgia'; c.textAlign = 'center'; c.fillText(syms[cur[i]].name, i * 90 + 45, 88);
        }
      };
      cv.addEventListener('click', (ev) => {
        const rect = cv.getBoundingClientRect();
        const i = Math.floor((((ev.clientX - rect.left) / rect.width) * cv.width) / 90);
        if (i < 0 || i >= n) return;
        cur[i] = (cur[i] + 1) % syms.length;
        ATL.audio.fx('click');
        draw();
      });
      const bOk = U.el('button', { text: 'Prüfen', class: 'primary' });
      bOk.addEventListener('click', () => {
        if (cur.every((v, i) => v === opts.solution[i])) { ATL.audio.fx('stone'); close(true); }
        else { ATL.audio.fx('fail'); close('wrong'); }
      });
      const bq = U.el('button', { text: 'Zurücktreten' });
      bq.addEventListener('click', () => close(false));
      row.appendChild(bOk); row.appendChild(bq);
      box.appendChild(row);
      draw();
    });
  };

  // ---------- Zettelkasten ----------
  P.catalog = function (g, opts) {
    if (g.fast) return Promise.resolve(opts.answer);
    return open(g, (box, close) => {
      box.appendChild(U.el('h2', { text: opts.title || 'Zettelkasten' }));
      box.appendChild(U.el('p', { text: opts.text || 'Schublade wählen, dann eine Karte.' }));
      const drawers = U.el('div', { class: 'row' });
      const cards = U.el('div', { class: 'row', style: 'margin-top:10px;min-height:120px;align-items:flex-start' });
      box.appendChild(drawers); box.appendChild(cards);
      opts.drawers.forEach((d) => {
        const b = U.el('div', { class: 'card', text: d.label });
        b.addEventListener('click', () => {
          document.querySelectorAll('#overlay .row .card').forEach((e) => e.classList.remove('on'));
          b.classList.add('on');
          cards.innerHTML = '';
          d.cards.forEach((cd) => {
            const e = U.el('div', { class: 'card', style: 'width:100%', text: cd.text });
            e.addEventListener('click', () => close(cd.id));
            cards.appendChild(e);
          });
        });
        drawers.appendChild(b);
      });
      const bq = U.el('button', { text: 'Schließen' });
      bq.addEventListener('click', () => close(null));
      box.appendChild(bq);
    });
  };

  // ---------- Keilschrift zuordnen ----------
  function wedgeGlyph(c, x, y, s, kind) {
    c.fillStyle = '#e6cf98';
    const w = (px, py, ang, len) => { c.save(); c.translate(px, py); c.rotate(ang); A.poly(c, [0, -s * 0.09, len, 0, 0, s * 0.09], c.fillStyle); c.restore(); };
    const L = s * 0.5;
    const pats = [
      () => { w(x - L, y - L * 0.5, 0, L * 2); w(x - L, y + L * 0.5, 0, L * 2); },
      () => { w(x, y - L, Math.PI / 2, L * 2); w(x - L * 0.7, y - L * 0.6, 0, L * 1.2); },
      () => { w(x - L, y - L, Math.PI / 4, L * 2.2); w(x - L, y + L, -Math.PI / 4, L * 2.2); },
      () => { w(x - L, y, 0, L * 2); w(x - L * 0.5, y - L, Math.PI / 2, L * 2); w(x + L * 0.5, y - L, Math.PI / 2, L * 2); },
      () => { w(x - L, y - L * 0.8, 0, L * 1.4); w(x - L, y, 0, L * 1.4); w(x - L, y + L * 0.8, 0, L * 1.4); },
      () => { w(x - L * 0.3, y - L, Math.PI / 2, L * 2); w(x - L, y + L * 0.3, 0, L * 2); },
      () => { w(x - L, y - L, Math.PI / 4, L * 1.5); w(x, y - L, Math.PI / 4, L * 1.5); w(x - L, y + L * 0.6, 0, L * 2); },
      () => { w(x - L, y, 0, L * 2); w(x + L * 0.2, y - L, Math.PI / 2, L * 2); },
    ];
    pats[kind % pats.length]();
  }
  P.wedgeGlyph = wedgeGlyph;
  P.cuneiform = function (g, opts) {
    if (g.fast) return Promise.resolve(true);
    const signs = opts.signs; // [{glyph:index, syl:'..'}]
    const choices = opts.choices; // Silben inkl. Ablenker
    const assign = new Array(signs.length).fill(null);
    let sel = 0;
    return open(g, (box, close) => {
      box.appendChild(U.el('h2', { text: opts.title || 'Keilschrift lesen' }));
      box.appendChild(U.el('p', { text: opts.text || 'Vergleiche die Zeichen mit der Silbentafel. Zeichen anklicken, dann die passende Silbe.' }));
      const cv = U.el('canvas', { width: 80 * signs.length + 20, height: 110 });
      box.appendChild(cv);
      const c = cv.getContext('2d');
      const draw = () => {
        c.clearRect(0, 0, cv.width, 110);
        signs.forEach((s, i) => {
          A.rr(c, 10 + i * 80, 6, 70, 96, 6, i === sel ? '#3f3020' : '#2a2016', i === sel ? '#ffd98a' : '#5a4225', 2);
          wedgeGlyph(c, 45 + i * 80, 44, 44, s.glyph);
          c.fillStyle = assign[i] ? '#ffe9b6' : '#5a4a3a'; c.font = '15px Georgia'; c.textAlign = 'center';
          c.fillText(assign[i] || '?', 45 + i * 80, 92);
        });
      };
      cv.addEventListener('click', (ev) => {
        const rect = cv.getBoundingClientRect();
        const i = Math.floor((((ev.clientX - rect.left) / rect.width) * cv.width - 10) / 80);
        if (i >= 0 && i < signs.length) { sel = i; draw(); }
      });
      if (opts.tableGlyphs) {
        box.appendChild(U.el('p', { text: 'Silbentafel:' }));
        const tv = U.el('canvas', { width: 70 * opts.tableGlyphs.length + 10, height: 80 });
        box.appendChild(tv);
        const tc = tv.getContext('2d');
        opts.tableGlyphs.forEach((t, i) => {
          wedgeGlyph(tc, 40 + i * 70, 32, 36, t.glyph);
          tc.fillStyle = '#c9a86a'; tc.font = '14px Georgia'; tc.textAlign = 'center'; tc.fillText(t.syl, 40 + i * 70, 72);
        });
      }
      const row = U.el('div', { class: 'row' });
      choices.forEach((ch) => {
        const b = U.el('button', { text: ch });
        b.addEventListener('click', () => { assign[sel] = ch; ATL.audio.fx('click'); if (sel < signs.length - 1) sel++; draw(); });
        row.appendChild(b);
      });
      box.appendChild(row);
      const row2 = U.el('div', { class: 'row' });
      const bOk = U.el('button', { text: 'Lesen', class: 'primary' });
      bOk.addEventListener('click', () => {
        if (signs.every((s, i) => assign[i] === s.syl)) { ATL.audio.fx('success'); close(true); }
        else { ATL.audio.fx('fail'); close('wrong'); }
      });
      const bq = U.el('button', { text: 'Abbrechen' });
      bq.addEventListener('click', () => close(false));
      row2.appendChild(bOk); row2.appendChild(bq);
      box.appendChild(row2);
      draw();
    });
  };

  // ---------- Schriftstück lesen ----------
  P.note = function (g, opts) {
    if (g.fast) return Promise.resolve(true);
    return open(g, (box, close) => {
      box.style.maxWidth = '640px';
      box.appendChild(U.el('h2', { text: opts.title }));
      const body = U.el('div', { style: 'font-size:17px;line-height:1.5;color:#efe1bf;white-space:pre-wrap;' + (opts.style || '') });
      body.textContent = opts.text;
      box.appendChild(body);
      const b = U.el('button', { text: opts.button || 'Weglegen', class: 'primary' });
      b.addEventListener('click', () => close(true));
      box.appendChild(b);
    });
  };

  // ---------- Allgemeine Auswahl ----------
  P.choose = function (g, opts) {
    if (g.fast) return Promise.resolve(opts.testAnswer ?? 0);
    return open(g, (box, close) => {
      box.appendChild(U.el('h2', { text: opts.title }));
      if (opts.text) box.appendChild(U.el('p', { text: opts.text }));
      opts.options.forEach((o, i) => {
        const b = U.el('button', { text: o, style: 'display:block;width:100%;text-align:left' });
        b.addEventListener('click', () => close(i));
        box.appendChild(b);
      });
      if (opts.cancel !== false) { const q = U.el('button', { text: 'Abbrechen' }); q.addEventListener('click', () => close(-1)); box.appendChild(q); }
    });
  };

  ATL.puzzles = P;
  ATL.Game.prototype.puzzle = function (name, opts) { return P[name](this, opts || {}); };
})(window.ATL);

</script>
<script>
/* Figuren: Aussehen und Textfarbe. */
(function (ATL) {

<script>
/* Gegenstände. look: Text beim Anschauen; use: Aktion ohne Ziel; useWith: Kombination mit anderem Gegenstand. */
(function (ATL) {

  D({ id: 'taschenmesser', name: 'Taschenmesser', look: 'Mein altes Taschenmesser. Die Klinge ist stumpf, aber sie tut ihren Dienst.' });

  D({ id: 'figur', name: 'Wächterfigur', look: 'Eine Steinfigur, kaum zwei Handbreit hoch: ein Mann mit einem Fischkopf als Kapuze. Im Inneren klappert etwas.', use: 'Ich sollte sie nicht einfach aufbrechen. Vielleicht vorsichtig mit einer Klinge.', useWith: { taschenmesser: async (g) => { await g.say('falk', 'Ich fahre mit der Klinge in die Fuge am Sockel…'); g.fx('stone'); await g.say('falk', 'Der Boden löst sich. Eine kleine Perle rollt heraus. Sie ist warm.'); g.take('perle'); g.set('perle_entnommen'); g.codex('orichalkum'); } } });
  D({ id: 'perle', name: 'Orichalkum-Perle', look: (g) => g.flag('perle_erklaert') ? 'Die Perle aus der Wächterfigur. Sie ist warm und schimmert grün, als brenne etwas in ihr.' : 'Eine Perle, groß wie eine Haselnuss. Sie ist warm. Metall, aber kein Metall, das ich kenne.', use: 'Sie schimmert. Sonst tut sie nichts, jedenfalls nicht in meiner Hand.' });
  D({ id: 'visitenkarte', name: 'Visitenkarte', look: 'Elfenbeinfarbener Karton. „Meridian-Gesellschaft, Berlin. Konrad Vesper.“ Unten mit Bleistift: „Whitmore, Figur, 12. Mai“.', use: note('Visitenkarte', 'MERIDIAN-GESELLSCHAFT\nBerlin, Tiergartenstraße\n\nKonrad Vesper\nVorsitzender\n\n(mit Bleistift:) Whitmore, Figur, 12. Mai') });

  D({ id: 'katalogkarte', name: 'Katalogkarte', look: 'Eine Karte aus dem Zettelkasten des Instituts: „Sais, Grabung 1911, Bericht. Regal IV, Fach 7.“ Jemand hat sie mitgenommen, damit niemand den Bericht findet.' });

  D({ id: 'uebersetzung', name: 'Übersetzung', look: 'Yusufs Übersetzung der Inschrift.', use: note('Übersetzung der Inschrift', (g) => g.flag('inschrift_text') || '…') });
  D({ id: 'bericht', name: 'Bericht über Sais', look: 'Ein dünner Grabungsbericht von 1911. Mit einer Skizze der Ruinen.', use: note('Grabung Sais, 1911', 'Die Tempelanlage der Neith liegt größtenteils unter Flugsand. Im Westen der Umfassungsmauer steht der Torso einer Statue der Göttin. Ihre Blickrichtung weist auf eine Vertiefung, die wir für den verschütteten Zugang zu einem Untergeschoss halten. Die Grabung wurde wegen Geldmangels abgebrochen.\n\nAnmerkung am Rand, andere Handschrift: „Solon hörte die Geschichte hier. Von den Priestern der Neith. Wenn sie etwas aufgeschrieben haben, dann unten.“') });

  D({ id: 'solontext', name: 'Abschrift der Solon-Tafel', icon: 'uebersetzung', look: 'Was ich von der Stele in der Kammer abgeschrieben habe. Griechisch, in Solons Zeit geschrieben.', use: note('Abschrift der Solon-Tafel', (g) => ATL.story.riddle(g)) });

  D({ id: 'oliven', name: 'Oliven', look: 'Eine Handvoll schwarzer Oliven aus der Taverne.' , use: 'Ich mag Oliven. Aber ich brauche sie vielleicht noch.' });

  D({ id: 'plan', name: 'Plan von Knossos', look: 'Bramwells Plan der Palastruinen mit handschriftlichen Anmerkungen.', use: note('Plan von Knossos', 'Skizze der Westmagazine, des Thronsaals und der Pfeilerkrypta.\n\nAnmerkung Bramwell: „Krypta, Pfeiler mit drei Doppeläxten. Der alte Yannis schwört, sein Großvater habe die mittlere gedrückt und dann sei der Boden aufgegangen. Aberglaube. Habe es nie probiert, der Pfeiler steht unter Denkmalschutz.“') });
  D({ id: 'wolle', name: 'Wollknäuel', look: 'Ein Knäuel grauer Schafwolle. Ariadne gab Theseus einen Faden, damit er aus dem Labyrinth zurückfand.' });
  D({ id: 'raki', name: 'Flasche Raki', look: 'Tresterschnaps aus der Taverne. Klar wie Wasser und ungefähr so harmlos wie Petroleum.' , use: 'Nicht jetzt. Ich brauche einen klaren Kopf.' });
  D({ id: 'doppelaxt', name: 'Bronzene Doppelaxt', look: 'Eine Doppelaxt aus Bronze, eine Labrys. Zu dünn, um damit zu schlagen. Ein Weihegeschenk, kein Werkzeug.' });
  D({ id: 'stiersiegel', name: 'Siegel des Stiers', look: 'Eine Scheibe aus dunkler Bronze mit einem Stierkopf. Auf der Rückseite acht Kerben.' });

  // Mesopotamien
  D({ id: 'syllabar', name: 'Silbentafel', look: 'Toms Liste der häufigsten Keilschriftzeichen mit ihren Silbenwerten.', use: async (g) => { await g.say('falk', 'Acht Zeichen mit Silbenwerten. Damit kann man einfache Zeilen buchstabieren.'); } });
  D({ id: 'kanister', name: 'Benzinkanister', look: 'Zwanzig Liter Benzin. Genug für den Jeep.' });
  D({ id: 'tafeltext', name: 'Abschrift der Fluttafel', look: 'Meine Abschrift der Zeilen von der Tafel im Archiv.', use: note('Von der Fluttafel', 'Ea hob die Weisen aus dem Meer.\nWo das süße Wasser der Tiefe steht, ruht das Zeichen der Flut.\nSieben Weise wachen an der Tür.\nDer vierte hält den Schlüssel.') });
  D({ id: 'flutsiegel', name: 'Siegel der Flut', look: 'Eine Scheibe aus blauem Stein mit drei Wellen. Auf der Rückseite acht Kerben.' });
  D({ id: 'schilf', name: 'Schilfbündel', look: 'Trockenes Schilf, zu einem Bündel gebunden. Die Sumerer bauten daraus Boote.' });

  // Thera
  D({ id: 'feuerwerk', name: 'Feuerwerkskörper', look: 'Ein Bündel Kracher für das Fest des Heiligen. Laut, aber harmlos.' });

  // Atlantis

<script>
/* Kodex der Mythen: kurze, sachliche Hintergrundtexte zu den Mythen und Kulturen im Spiel. */
(function (ATL) {
  ATL.codex = {
    platon: { title: 'Atlantis bei Platon', origin: 'Platon, Timaios und Kritias (4. Jh. v. Chr.)', text: 'Atlantis kommt in zwei Dialogen Platons vor. Im Timaios erzählt Kritias, Solon habe die Geschichte von Priestern in Sais gehört: eine Insel jenseits der Säulen des Herakles, größer als Libyen und Asien zusammen, deren Könige einen Krieg gegen das alte Athen führten. Athen siegte, danach versanken Insel und Heer in einem Tag und einer Nacht im Meer.\nDer Kritias beschreibt die Stadt genauer: Ringe aus Land und Wasser, ein Tempel des Poseidon, Mauern aus Metall. Der Dialog bricht mitten im Satz ab.\nOb Platon eine Überlieferung wiedergab oder die Geschichte als Lehrstück erfand, ist umstritten. Die meisten Altertumswissenschaftler halten sie für Platons eigene Erfindung. Frühere Texte, die Atlantis erwähnen, sind nicht bekannt.' },
    solon: { title: 'Solon in Sais', origin: 'Platon, Timaios 21e–25d', text: 'Solon war ein athenischer Gesetzgeber des frühen 6. Jahrhunderts v. Chr. Nach Platon reiste er nach Ägypten und sprach in Sais, der Stadt der Göttin Neith, mit Priestern. Einer von ihnen sagte ihm den oft zitierten Satz, die Griechen seien immer Kinder, weil sie keine alte Überlieferung besäßen; die Ägypter dagegen hätten alles aufgeschrieben.\nSais war im 7. und 6. Jahrhundert v. Chr. Hauptstadt Ägyptens (26. Dynastie). Von der Stadt und dem Tempel der Neith sind heute nur Reste im Nildelta bei Sa el-Hagar übrig.' },
    neith: { title: 'Neith', origin: 'Ägyptische Religion', text: 'Neith ist eine der ältesten ägyptischen Gottheiten, verehrt vor allem in Sais im westlichen Nildelta. Sie galt als Schöpferin, als Göttin der Jagd, des Krieges und des Webens. Ihr Zeichen sind zwei gekreuzte Pfeile auf einem Schild.\nDie Griechen setzten Neith mit Athena gleich. Das ist der Grund, warum in Platons Erzählung ausgerechnet die Priester von Sais die Geschichte vom alten Athen bewahren.' },
    thoth: { title: 'Thot', origin: 'Ägyptische Religion', text: 'Thot ist der ägyptische Gott der Schrift, des Zählens und des Mondes. Er wird mit dem Kopf eines Ibis oder als Pavian dargestellt. Beim Totengericht schreibt er das Ergebnis der Herzwägung auf.\nDie Geschichte vom „Buch des Thot“, das alles Wissen enthält und Unglück über den bringt, der es stiehlt, stammt aus demotischen Erzählungen der Ptolemäerzeit (Setna-Erzählungen). Sie ist also deutlich jünger als die Pyramiden.' },
    maat: { title: 'Das Totengericht', origin: 'Ägyptisches Totenbuch, Spruch 125', text: 'Nach ägyptischer Vorstellung wird das Herz des Toten auf einer Waage gegen die Feder der Maat gewogen, der Göttin der Wahrheit und Ordnung. Anubis bedient die Waage, Thot schreibt das Ergebnis auf. Ist das Herz schwerer als die Feder, verschlingt es das Mischwesen Ammit.\nDer Herzskarabäus, ein Amulett aus Stein, wurde den Toten auf die Brust gelegt. Der Spruch darauf bittet das Herz, beim Gericht nicht gegen seinen Besitzer auszusagen.' },
    hieroglyphen: { title: 'Hieroglyphen', origin: 'Schriftgeschichte', text: 'Die ägyptische Hieroglyphenschrift ist ab etwa 3200 v. Chr. belegt und wurde bis ins 4. Jahrhundert n. Chr. benutzt. Sie mischt Lautzeichen für einen bis drei Konsonanten mit Wortzeichen und Deutzeichen. Vokale werden nicht geschrieben.\nJean-François Champollion gelang 1822 die Entzifferung, vor allem mit Hilfe des dreisprachigen Steins von Rosette.' },
    orichalkum: { title: 'Orichalkum', origin: 'Platon, Kritias 114e, 116c', text: 'Platon nennt Orichalkum als Metall, das in Atlantis abgebaut wurde und im Wert nur dem Gold nachstand. Die Atlanter hätten damit Mauern und die Innenwände des Poseidontempels verkleidet. Zu seiner Zeit, schreibt er, sei es nur noch dem Namen nach bekannt.\nDas Wort bedeutet „Bergkupfer“. In römischen Quellen bezeichnet orichalcum eine Messinglegierung. Die Vorstellung eines leuchtenden, kraftspendenden Metalls ist Erfindung späterer Jahrhunderte.' },
    minotaurus: { title: 'Labyrinth und Minotaurus', origin: 'Griechische Mythologie', text: 'König Minos von Kreta ließ von Daidalos das Labyrinth bauen, um den Minotauros einzusperren, ein Wesen halb Mensch, halb Stier, das seine Frau Pasiphae mit einem Stier des Poseidon gezeugt hatte. Athen musste alle neun Jahre sieben junge Männer und sieben junge Frauen als Tribut schicken.\nTheseus tötete das Ungeheuer. Ariadne, Tochter des Minos, gab ihm ein Wollknäuel, dessen Faden ihn wieder hinausführte.\nArthur Evans, der Knossos ab 1900 ausgrub, vermutete einen Zusammenhang zwischen dem Wort Labyrinth und „labrys“, der Doppelaxt, die im Palast überall als Zeichen vorkommt. Die Herleitung ist bis heute nicht gesichert.' },
    minoer: { title: 'Die Minoer', origin: 'Bronzezeit auf Kreta', text: 'Die minoische Kultur auf Kreta bestand etwa von 3000 bis 1450 v. Chr. Ihre Paläste in Knossos, Phaistos, Malia und Kato Zakros hatten Höfe, Magazine mit riesigen Vorratsgefäßen (Pithoi) und Wandmalereien, darunter das bekannte Fresko der Stierspringer.\nDen Namen gab Arthur Evans nach dem mythischen König Minos. Die Schrift der Minoer, Linear A, ist nicht entziffert. Wovon ihre Kultur unterging, ist umstritten; der Ausbruch von Thera und das Vordringen der Mykener spielen in den meisten Erklärungen eine Rolle.' },
    stier: { title: 'Der Stier', origin: 'Platon, Kritias 119d–120c; minoische Kunst', text: 'Im Kritias berichtet Platon, die zehn Könige von Atlantis hätten sich im Tempel des Poseidon versammelt, dort freilaufende Stiere ohne Waffen gejagt, mit Holzstangen und Schlingen, und einen Stier über einer Säule mit den Gesetzen geopfert.\nAuf Kreta ist der Stier in der minoischen Kunst allgegenwärtig: als Fresko, als Trinkgefäß in Stierform, als „Kulthörner“ auf den Mauern der Paläste. Das ist einer der Gründe, warum Kreta und Thera seit dem frühen 20. Jahrhundert als Vorbild für Platons Atlantis diskutiert werden.' },
    thera: { title: 'Thera', origin: 'Geologie und Archäologie von Santorin', text: 'Die Insel Thera, heute Santorin, ist der Rand eines Vulkans. Sein Ausbruch in der Bronzezeit, nach den meisten Datierungen im 17. oder 16. Jahrhundert v. Chr., gehört zu den größten der letzten zehntausend Jahre. Die Mitte der Insel stürzte ein und bildete die heutige Caldera.\nDie Siedlung Akrotiri im Süden wurde unter Bimsstein und Asche begraben und dadurch erhalten, mit mehrstöckigen Häusern und Wandmalereien: Schiffe, Schwalben, Lilien, Boxer. Systematisch ausgegraben wurde sie ab 1967 von Spyridon Marinatos, der schon 1939 vermutet hatte, der Ausbruch habe die minoische Kultur getroffen.' },
    gilgamesch: { title: 'Die Flut im Gilgamesch-Epos', origin: 'Gilgamesch-Epos, Tafel XI', text: 'Auf der elften Tafel des Gilgamesch-Epos erzählt Utnapischtim, wie er die große Flut überlebte. Der Gott Ea warnte ihn durch die Wand seines Schilfhauses: „Reiße das Haus ab, baue ein Schiff.“ Er baute es, nahm Familie, Handwerker und Tiere an Bord, die Flut dauerte sechs Tage und sieben Nächte. Das Schiff blieb am Berg Nimusch hängen. Utnapischtim ließ eine Taube, eine Schwalbe und einen Raben fliegen; der Rabe kam nicht zurück.\nDie Erzählung ist älter als das Epos: Es gibt eine sumerische Fassung mit dem Helden Ziusudra und die babylonische Atrahasis-Dichtung. Die Tafel XI wurde 1872 von George Smith im British Museum erkannt.' },
    apkallu: { title: 'Die Apkallu', origin: 'Mesopotamische Überlieferung; Berossos', text: 'Die Apkallu sind sieben Weise, die nach mesopotamischer Überlieferung vor der Flut den Menschen die Künste der Zivilisation brachten. Auf Reliefs und Amuletten erscheinen sie als Männer im Fischgewand, mit einem Fischkopf als Kapuze, oder mit Vogelkopf und Flügeln.\nDer babylonische Priester Berossos schrieb im 3. Jahrhundert v. Chr. auf Griechisch, ein Wesen namens Oannes sei aus dem Meer gestiegen, halb Fisch, halb Mensch, und habe die Menschen Schrift, Ackerbau und Gesetze gelehrt. Tagsüber lehrte es, nachts kehrte es ins Meer zurück.' },
    eridu: { title: 'Eridu und der Abzu', origin: 'Sumerische Religion', text: 'Eridu im Süden des heutigen Irak galt den Sumerern als älteste Stadt der Welt, als die Stadt, in der das Königtum vom Himmel herabkam. Ausgrabungen fanden dort eine Folge von Tempeln, die bis ins 6. Jahrtausend v. Chr. zurückreicht.\nEridu war die Stadt des Gottes Enki (babylonisch Ea), des Herrn der Weisheit und des süßen Wassers. Sein Reich ist der Abzu, das unterirdische Süßwassermeer, aus dem Quellen und Flüsse gespeist werden. Sein Tempel hieß „Haus des Abzu“.' },
    keilschrift: { title: 'Keilschrift', origin: 'Schriftgeschichte', text: 'Die Keilschrift entstand um 3200 v. Chr. in Mesopotamien. Mit einem Griffel wurden Keile in feuchten Ton gedrückt. Die Zeichen stehen für Silben oder ganze Wörter; die gleiche Schrift wurde für Sumerisch, Akkadisch, Hethitisch und andere Sprachen benutzt.\nGebrannter oder versehentlich gebrannter Ton ist haltbar, deshalb sind Hunderttausende von Tafeln erhalten. Entziffert wurde die Schrift im 19. Jahrhundert, unter anderem mit der dreisprachigen Inschrift von Behistun.' },
    zehnkoenige: { title: 'Die zehn Könige', origin: 'Platon, Kritias 113e–114d', text: 'Nach dem Kritias zeugte Poseidon mit der sterblichen Kleito fünf Zwillingspaare. Der Älteste, Atlas, wurde König über die ganze Insel, nach ihm heißt sie und das Meer um sie herum. Sein Zwilling Gadeiros (griechisch Eumelos) erhielt den Landstrich gegenüber Gadeira (Cádiz).\nDie übrigen Paare: Ampheres und Euaimon, Mneseus und Autochthon, Elasippos und Mestor, Azaes und Diaprepes. Jeder herrschte über einen Teil der Insel; über allen stand das Haus des Atlas.' },
    poseidon: { title: 'Poseidon', origin: 'Griechische Religion; Platon, Kritias', text: 'Poseidon ist der Gott des Meeres, der Erdbeben und der Pferde. Bei Homer heißt er „Erderschütterer“. Seine Waffe ist der Dreizack.\nIm Kritias ist Atlantis sein Los bei der Verteilung der Welt unter die Götter. Sein Tempel in der Mitte der Stadt war außen mit Silber, innen mit Gold, Elfenbein und Orichalkum verkleidet. Darin stand sein Standbild auf einem Wagen mit sechs geflügelten Pferden, so hoch, dass es die Decke berührte.' },
    ringe: { title: 'Die Ringe von Atlantis', origin: 'Platon, Kritias 115c–117e', text: 'Platon beschreibt die Hauptstadt von Atlantis als Folge von Ringen: In der Mitte ein Hügel mit dem Tempel, darum abwechselnd drei Ringe aus Wasser und zwei aus Land. Brücken verbanden die Ringe, ein Kanal führte zum Meer. Die Mauern der Ringe waren mit Bronze, Zinn und Orichalkum verkleidet.\nAuf der Insel gab es heiße und kalte Quellen, Hafenanlagen, eine Rennbahn und Gärten. Die Beschreibung ist so genau, dass sie immer wieder als Bauplan gelesen wurde; Platon selbst lässt Kritias sagen, er habe sie in der Kindheit auswendig gelernt.' },
    pharos: { title: 'Alexandria', origin: 'Hellenistische Geschichte', text: 'Alexandria wurde 331 v. Chr. von Alexander dem Großen gegründet und war unter den Ptolemäern Hauptstadt Ägyptens. Der Leuchtturm auf der Insel Pharos zählte zu den Sieben Weltwundern; er stürzte nach Erdbeben im 14. Jahrhundert endgültig ein. An seiner Stelle steht heute die Festung Qait-Bey.\nDie Bibliothek von Alexandria war die größte der Antike. Wann und wie sie unterging, ist nicht sicher; ein einzelner großer Brand lässt sich aus den Quellen nicht belegen.' },
    ariadne: { title: 'Der Faden der Ariadne', origin: 'Griechische Mythologie', text: 'Ariadne, Tochter des Minos, verliebte sich in Theseus und gab ihm ein Wollknäuel. Er band das Ende am Eingang des Labyrinths fest und rollte den Faden auf dem Weg hinein ab. Nach dem Kampf mit dem Minotauros folgte er ihm zurück.\nTheseus nahm Ariadne mit auf das Schiff nach Athen und ließ sie auf Naxos zurück, wo sie von Dionysos gefunden wurde. Bis heute heißt ein Hilfsmittel, das aus einer verwickelten Lage herausführt, „Ariadnefaden“.' },
  };
})(window.ATL);

</script>
<script>
/* Handlungsrahmen: Spielstart, Titelbild, Rätsel-Lösung der drei Siegel, Reiseziele. */
(function (ATL) {
  const A = ATL.A;
  const S = {};

  // Die Lösung des Ringschlosses hängt vom Spielstand-Startwert ab.
  S.solution = function (g) {
    const r = ATL.U.rng(g.state.seed + 77);
    const idx = [0, 1, 2, 3, 4, 5, 6, 7];
    const out = [];
    while (out.length < 3) { const k = Math.floor(r() * idx.length); out.push(idx.splice(k, 1)[0]); }
    return out;
  };
  S.riddle = function (g) {

      'Drei Siegel hüten das Tor unter dem brennenden Berg. Wer es öffnen will, drehe die Ringe.\n\n' +
      `Das Siegel der Sonne weise ${sy[sol[0]].riddle}.\n` +
      `Das Siegel des Stiers weise ${sy[sol[1]].riddle}.\n` +
      `Das Siegel der Flut weise ${sy[sol[2]].riddle}.\n\n` +
      'Das Siegel des Stiers ruht bei dem, der im Haus des Minos hinter dem Faden wartet. Das Siegel der Flut ruht bei den Weisen, die aus dem Meer kamen, im Haus des süßen Wassers.\n\n' +
      'Und der Erstgeborene öffne die Halle der Zehn, mit seinem Zwilling an der Hand.';
  };

  // Reiseziele auf der Karte
  S.locations = {

    thera: { name: 'Thera', x: 618, y: 272, room: 'th_harbor', pos: [200, 520], dir: 'r', cond: (g) => g.has('sonnensiegel') && g.has('stiersiegel') && g.has('flutsiegel') },
  };

  S.openMap = async function (g, from) {
    g.set('ort', from || g.flag('ort'));
    await g.goto('map');
  };

  S.travel = async function (g, destId) {
    const from = S.locations[g.flag('ort')] || S.locations.whitmore;
    const to = S.locations[destId];
    g.set('reise', { from: [from.x, from.y], to: [to.x, to.y], t: 0 });
    await g.scene(async () => {
      if (!g.fast) await new Promise((r) => { const st = performance.now(); const step = () => { const t = Math.min(1, (performance.now() - st) / 2200); g.state.flags.reise.t = t; if (t < 1) requestAnimationFrame(step); else r(); }; step(); });
      g.set('reise', null);
      g.set('ort', destId);
      await g.goto(to.room, to.pos[0], to.pos[1], to.dir);
    });
  };

  // ---------- Titelbild ----------
  ATL.rooms.define({
    id: 'title', name: '', noHero: true, ambient: 'map', noSave: true,
    paint(ctx) {
      A.sky(ctx, 960, 600, '#0a0f2a', '#3a2a5a');
      A.stars(ctx, 960, 300, 160, 8);
      A.sun(ctx, 480, 300, 60, '#ffd890');
      A.sea(ctx, 0, 320, 960, 280, '#2a3a6a', '#0a1020', 4);
      // Ringe von Atlantis als Silhouette
      for (let i = 0; i < 4; i++) A.ell(ctx, 480, 330, 300 - i * 70, 40 - i * 8, null, i % 2 ? 'rgba(100,220,200,0.35)' : 'rgba(40,60,100,0.8)', 6);
      A.ell(ctx, 480, 330, 40, 8, '#1a2a3a');
      A.column(ctx, 480, 332, 60, 14, '#8a9aa0', 'atlantis');
      A.mountains(ctx, 960, 330, '#141a2a', 21, 90, 130);
      A.vignette(ctx, 960, 600, 0.6);
      A.grain(ctx, 960, 600, 3, 0.04);
    },
    animate(ctx, t) { A.waterAnim(ctx, 0, 330, 960, 270, t, 'rgba(180,220,255,0.1)'); A.glow(ctx, 480, 300, 140 + Math.sin(t * 0.8) * 12, 'rgba(255,210,140,0.5)', 0.35); },
    overlayPaint(ctx, t) {
      ctx.save();
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.font = 'italic 22px Georgia, serif';
      ctx.fillStyle = 'rgba(240,220,180,0.85)';
      ctx.fillText('Ein Abenteuer in sieben Kapiteln', 62, 92);
      ctx.font = 'bold 64px "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif';
      const g = ctx.createLinearGradient(0, 100, 0, 220);
      g.addColorStop(0, '#fff2c8'); g.addColorStop(0.5, '#e0b84a'); g.addColorStop(1, '#8a5a1a');
      ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 4;
      ctx.fillStyle = g;
      ctx.fillText('Die Siegel', 60, 160);
      ctx.fillText('von Atlantis', 60, 228);
      ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      ctx.strokeStyle = 'rgba(255,230,160,0.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(62, 246); ctx.lineTo(430, 246); ctx.stroke();
      ctx.font = '15px Georgia, serif'; ctx.fillStyle = 'rgba(220,200,160,0.7)';
      ctx.fillText('1938. Ein Archäologe, eine Mythologin, drei Siegel.', 62, 270);
      ctx.restore();
    },
  });

  S.newGame = async function (g) {
    g.state = g.newState();
    g.actors = {};
    g.hero = g.actor('falk');
    g.busy = false; g.phase = null; g.cutscene = false; g.inDialog = false;
    if (g.ui) { g.ui.setCutscene(false); g.ui.hideDialog(); g.ui.refreshInventory(); }
    g.take('taschenmesser', { silent: true });
    g.take('uhr', { silent: true });
    g.take('muenzen', { silent: true });
    g.set('ort', 'whitmore');
    await g.goto('p_office', 480, 520, 'd');
  };

  ATL.story = S;
})(window.ATL);

</script>
<script>
/* Die Reisekarte: Nordatlantik und Mittelmeer im Stil einer Seekarte der 1930er. */
(function (ATL) {
  const A = ATL.A;

  ATL.rooms.define({
    id: 'map', name: 'Reisekarte', noHero: true, ambient: 'map', noSave: true,

      A.rect(ctx, 0, 0, 960, 600, '#d9c9a0');

      // Grönland, Island
      A.poly(ctx, [300, 0, 420, 0, 400, 60, 350, 90, 310, 60], land, edge, 2);
      A.poly(ctx, [430, 120, 470, 112, 480, 135, 445, 145], land, edge, 2);
      // Europa
      A.poly(ctx, [520, 0, 960, 0, 960, 260, 900, 250, 860, 275, 820, 265, 780, 285, 740, 275, 700, 300, 660, 290, 640, 270, 600, 275, 570, 250, 540, 260, 520, 240, 500, 205, 470, 190, 490, 150, 520, 120, 545, 80, 520, 40], land, edge, 2);
      // Britische Inseln
      A.poly(ctx, [470, 80, 500, 60, 510, 110, 490, 140, 470, 120], land, edge, 2);
      // Afrika
      A.poly(ctx, [470, 330, 560, 320, 620, 340, 680, 345, 740, 360, 800, 390, 900, 420, 960, 440, 960, 600, 420, 600, 400, 500, 440, 400], land, edge, 2);
      // Arabien, Vorderer Orient
      A.poly(ctx, [700, 300, 760, 295, 820, 310, 880, 300, 960, 280, 960, 430, 900, 420, 840, 400, 780, 370], land, edge, 2);
      // Iberien, Italien, Griechenland als Zungen ins Mittelmeer
      A.poly(ctx, [500, 205, 560, 200, 580, 240, 540, 262, 505, 245], land, edge, 2);
      A.poly(ctx, [600, 220, 615, 275, 635, 300, 618, 305, 598, 270, 590, 240], land, edge, 2);
      A.poly(ctx, [640, 240, 670, 235, 675, 270, 660, 290, 645, 280], land, edge, 2);
      // Kreta, Zypern
      A.poly(ctx, [590, 298, 620, 296, 622, 304, 592, 306], land, edge, 1.5);
      A.poly(ctx, [700, 318, 722, 315, 724, 324, 704, 326], land, edge, 1.5);
      // Beschriftung
      const lab = (t, x, y, s) => A.text(ctx, t, x, y, { font: `italic ${s || 15}px Georgia`, color: '#5a4a30', align: 'center' });
      lab('ATLANTISCHER OZEAN', 330, 300, 17);
      lab('MITTELMEER', 590, 330, 13);
      lab('EUROPA', 700, 150, 17);
      lab('AFRIKA', 640, 500, 17);
      lab('AMERIKA', 110, 120, 15);
      lab('ARABIEN', 860, 370, 12);
      // Kompassrose
      ctx.save(); ctx.translate(850, 110);
      for (let i = 0; i < 8; i++) { ctx.rotate(Math.PI / 4); A.poly(ctx, [0, 0, 8, -8, 0, i % 2 ? -34 : -50, -8, -8], i % 2 ? '#8a7a58' : '#3a2a1a'); }
      ctx.restore();
      A.text(ctx, 'N', 850, 50, { font: 'bold 16px Georgia', color: '#3a2a1a', align: 'center' });
      // Orte
      for (const id in S().locations) {
        const l = S().locations[id];
        const avail = l.cond(g) || g.flag('ort') === id;
        A.circle(ctx, l.x, l.y, 5, avail ? '#a3312a' : '#8a7a58');
        A.circle(ctx, l.x, l.y, 8, null, avail ? '#a3312a' : '#8a7a58', 1.5);
        A.text(ctx, l.name, l.x + (l.x > 700 ? -12 : 12), l.y + 5, { font: 'bold 14px Georgia', color: avail ? '#3a1a10' : '#7a6a48', align: l.x > 700 ? 'right' : 'left' });
      }
      A.text(ctx, 'Klick auf einen Ort, um dorthin zu reisen.', 480, 585, { font: '15px Georgia', color: '#5a4a30', align: 'center' });
      A.grain(ctx, 960, 600, 9, 0.04);

    animate(ctx, t, g) {

      if (!r) return;
      const [x0, y0] = r.from, [x1, y1] = r.to;
      const n = Math.floor(40 * r.t);
      ctx.fillStyle = '#a3312a';
      for (let i = 0; i <= n; i++) { const k = i / 40; ctx.fillRect(x0 + (x1 - x0) * k - 2, y0 + (y1 - y0) * k - 2, 4, 4); }
      const px = x0 + (x1 - x0) * r.t, py = y0 + (y1 - y0) * r.t;
      ctx.save(); ctx.translate(px, py); ctx.rotate(Math.atan2(y1 - y0, x1 - x0));
      A.poly(ctx, [-14, 0, 6, -5, 12, 0, 6, 5], '#3a2a1a');
      A.poly(ctx, [-2, 0, 0, -12, 4, -12, 4, 12, 0, 12], '#3a2a1a');
      ctx.restore();
    },
    get hotspots() {
      return Object.keys(S().locations).map((id) => {
        const l = S().locations[id];
        return { id: 'ort_' + id, name: l.name, rect: [l.x - 14, l.y - 14, 28 + l.name.length * 8, 28], cond: (g) => l.cond(g) && g.flag('ort') !== id, noWalk: true, walk: (g) => S().travel(g, id), look: (g) => `${l.name}. ${g.flag('ort') === id ? 'Hier bin ich.' : 'Da könnte ich hinreisen.'}`, use: (g) => S().travel(g, id) };
      });
    },
  });
})(window.ATL);

</script>

      // Kistenstapel

      // Zerbrochene Kiste und Figur
      if (g.flag('kiste_gefallen')) {

      // Mauseloch

      A.grain(ctx, 960, 600, 6, 0.05);
    },
    animate(ctx, t, g) { if (g.flag('licht')) A.dust(ctx, 300, 200, 500, 300, t, 40); },
    get hotspots() {
      const lit = [
        { id: 'schnur', name: 'Zugschnur', rect: [470, 140, 40, 130], at: [500, 470, 'u'],
          look: (g) => g.flag('licht') ? 'Die Schnur der Glühbirne. Das Licht brennt.' : 'Eine Schnur, die von der Decke hängt. Daran hängt vermutlich das Licht.',
          pull: async (g) => { if (g.flag('licht')) { g.set('licht', false); g.dark = 0.85; g.repaint(); return 'Dunkel.'; } g.set('licht'); g.dark = 0; g.repaint(); g.fx('click'); await g.say('falk', 'Licht. Vierzig Watt und ein paar tausend Motten.'); },
          use: (g) => g.roomDef.hotspots.find((h) => h.id === 'schnur').pull(g) },
        { id: 'fenster', name: 'Dachfenster', rect: [856, 136, 68, 90], at: [890, 440, 'u'], look: 'Ein kleines Fenster. Man sieht das Dach des Ostflügels. Es ist tatsächlich undicht.', open: 'Es ist zugenagelt.' },
        { id: 'regal', name: 'Regalbrett', rect: [100, 90, 340, 100], at: [360, 460, 'u'],
          look: (g) => g.flag('kiste_gefallen') ? 'Das Brett. Die Kiste aus Thera liegt jetzt unten, in Einzelteilen.' : 'Ein Brett unter dem Dach, viel zu hoch. Darauf drei Kisten: Ur 1928, Gizeh, und Thera 1932. Die brauche ich.',
          take: (g) => g.flag('kiste_gefallen') ? 'Da oben ist nichts mehr, was ich brauche.' : 'Zu hoch. Ich komme nicht heran, nicht einmal auf Zehenspitzen.',
          use: (g) => g.flag('kiste_gefallen') ? 'Da ist nichts mehr.' : 'Zu hoch. Ich bräuchte eine Leiter.',
          useWith: {
            leiter: async (g) => {
              g.drop('leiter'); g.set('leiter_platziert'); g.repaint();
              await g.say('falk', 'Die Leiter steht. Mehr oder weniger.');
              await g.scene(async () => {
                await g.walk('falk', 372, 440, 'u');
                g.hero.fixedScale = g.hero.scale;
                for (let i = 1; i <= 10 && !g.fast; i++) { g.hero.offsetY = -i * 22; await g.wait(120); }
                g.hero.offsetY = -220;
                await g.say('falk', 'Thera 1932. Da ist sie. Nur ein bisschen näher…');
                g.hero.anim = 'reach';
                await g.wait(700);
                g.fx('stone');
                await g.say('falk', 'Hoppla.');
                g.hero.anim = 'stand';
                g.set('kiste_gefallen'); g.repaint();
                g.fx('drop');
                await g.message('Die Kiste kippt, fällt und zerspringt auf den Dielen.', 2200);
                for (let i = 9; i >= 0 && !g.fast; i--) { g.hero.offsetY = -i * 22; await g.wait(90); }
                g.hero.offsetY = 0; g.hero.fixedScale = null;
                await g.say('falk', 'Sechs Jahre Staub, und ich mache in zehn Sekunden Kleinholz daraus. Livia hätte ihre Freude.');
                await g.say('falk', 'Aber da liegt sie. Die Figur. Heil, soweit ich sehe.');
              });
            },
          } },
        { id: 'truhe', name: 'Truhe', rect: [60, 330, 140, 75], at: [130, 440, 'u'],
          look: 'Eine Seemannstruhe. Jemand hat „Zeitungen“ darauf geschrieben.',
          open: async (g) => { await g.say('falk', 'Zeitungen von 1932. „Amerikanische Grabung auf Thera: Dr. Livia Marsh findet Häuser unter der Asche.“'); await g.say('falk', 'Und ein Foto von ihr, wie sie vor einem Fresko steht. Sie sieht glücklich aus. Das war, bevor wir uns gestritten haben.'); g.codex('thera'); },
          use: (g) => g.roomDef.hotspots.find((h) => h.id === 'truhe').open(g), take: 'Zu schwer, und ich sammle keine alten Zeitungen.' },
        { id: 'kisten', name: 'Kistenstapel', rect: [560, 260, 230, 150], at: [520, 470, 'r'], cond: (g) => !g.flag('kisten_verschoben'),
          look: 'Keramik, Scherben, Bücher. Hinter den Kisten lehnt etwas an der Wand.',

          pull: 'Ziehen bringt nichts, ich muss sie wegschieben.', take: 'Zu schwer. Und zu viele.', open: 'Scherben. Ich habe genug Scherben gesehen.' },
        { id: 'kisten2', name: 'Kistenstapel', rect: [660, 260, 230, 150], at: [620, 470, 'r'], cond: (g) => g.flag('kisten_verschoben'),
          look: 'Die Kisten stehen jetzt an der Wand. Der Staub darauf hat sich kaum bewegt.', push: 'Das reicht. Sie stehen gut.', open: 'Scherben. Ich habe genug Scherben gesehen.' },
        { id: 'leiter', name: 'Leiter', rect: [695, 205, 55, 200], at: [660, 470, 'r'], cond: (g) => g.flag('kisten_verschoben') && !g.flag('leiter_genommen'),
          look: 'Eine Holzleiter. Zwei Sprossen wackeln.',

        { id: 'leiter2', name: 'Leiter', rect: [330, 180, 80, 240], at: [372, 460, 'u'], cond: (g) => g.flag('leiter_platziert'),

  // Im Dunkeln antworten die meisten Objekte nicht
  const attic = ATL.rooms.get('p_attic');

    if (!g || g.flag('licht')) return list;
    return list.map((h) => (h.id === 'schnur' || h.id === 'fenster') ? h : Object.assign({}, h, { name: 'Dunkelheit', look: 'Zu dunkel, um etwas zu erkennen.', use: 'Ich sehe die Hand vor Augen nicht.', take: 'Zu dunkel.', push: 'Zu dunkel.', pull: 'Zu dunkel.', open: 'Zu dunkel.', useWith: { default: 'Zu dunkel.' } }));

  // ---------------------------------------------------------------- Innenhof
  R({

      A.rect(ctx, 220, 445, 100, 8, '#5a3f28'); A.rect(ctx, 220, 455, 100, 6, '#5a3f28'); A.rect(ctx, 228, 461, 6, 22, '#3a2a1a'); A.rect(ctx, 306, 461, 6, 22, '#3a2a1a');
      A.statue(ctx, 640, 470, 110, '#a8a8a0', 'standing');

      for (let i = 0; i < 4; i++) A.rect(ctx, 914 + i * 8, 310, 3, 170, '#3a3a3a');
      A.rect(ctx, 900, 296, 58, 8, '#3a3a3a');
      A.vignette(ctx, 960, 600, 0.3);
    },
    hotspots: [
      { id: 'bank', name: 'Bank', rect: [218, 440, 104, 45], at: [270, 500, 'u'], look: 'Eine Bank. Hier habe ich 1931 Livia zum ersten Mal gesagt, dass ihre Atlantis-Theorie Unsinn ist. Sie hat gelacht. Damals.', use: 'Keine Zeit zum Sitzen.' },
      { id: 'statue', name: 'Statue', rect: [610, 360, 60, 115], at: [640, 500, 'u'], look: 'Ezra Whitmore, Gründer des Colleges. Er sieht aus, als hätte er Hank eingestellt.', use: 'Ich lasse ihn stehen.' },
      { id: 'baum', name: 'Ahorn', rect: [60, 280, 130, 200], at: [140, 500, 'u'], look: 'Ein alter Ahorn. Im Herbst rot, im Mai voller Vögel.' },
      { id: 'gebaeude', name: 'Institutsgebäude', rect: [0, 110, 960, 130], at: [480, 470, 'u'], look: 'Das Institut für Archäologie. Backstein, 1902, undichtes Dach.' },
    ],
    exits: [
      { id: 'durchgang', name: 'Durchgang zum Institut', rect: [400, 240, 160, 180], at: [480, 460, 'u'], to: 'p_hall', pos: [80, 500], dir: 'r', look: 'Der Durchgang zurück ins Institut.' },
      { id: 'tor', name: 'Tor zur Straße', rect: [896, 296, 64, 200], at: [880, 500, 'r'], look: (g) => g.flag('kessler_geflohen') ? 'Das Tor zur Straße. Von hier fährt der Bus nach Boston, von Boston der Zug nach New York.' : 'Das Tor zur Straße.',
        before: async (g) => {
          if (!g.flag('kessler_geflohen')) { await g.say('falk', 'Ich habe hier noch zu tun.'); return false; }
          if (g.has('schluessel')) { g.drop('schluessel'); await g.say('falk', 'Hanks Schlüssel lege ich beim Pförtner ab. Sonst gibt es Ärger, hat er gesagt.'); }

    actors: [
      { id: 'kessler', x: 620, y: 500, dir: 'l', cond: (g) => !g.flag('kessler_geflohen'), talk: (g) => g.dialog('kessler_hof'), look: 'Herr Kessler aus Boston. Breite Schultern, teurer Mantel, und ein Gesicht, das noch nie ein Museum von innen gesehen hat.',

        await g.say('falk', '„Meridian-Gesellschaft, Berlin. Konrad Vesper.“');

        await g.say('greaves', 'Offenbar hat er seither Geld gefunden. Und Leute wie diesen Kessler.');
        await g.say('falk', 'Die Figur kam aus Livias Grabung. Wenn jemand weiß, was Vesper damit will, dann sie.');
        await g.say('greaves', 'Livia Marsh hält in New York Vorträge. Über Atlantis, für Leute mit Geld.');
        await g.say('falk', 'Dann fahre ich nach New York.');
        await g.say('greaves', 'Falk. Das College zahlt keine Spesen.');

  ATL.dialogs.define('kessler_hof', {
    nodes: {
      root: {
        options: [
          { text: 'Herr Kessler? Vom Museum in Boston?', once: true, say: [['kessler', 'Richtig.'], ['falk', 'Welche Abteilung?'], ['kessler', 'Ankäufe.'], ['falk', 'Ich kenne den Leiter der Ankäufe. Er heißt Whitcombe.'], ['kessler', 'Er hat viele Mitarbeiter.']] },
          { text: 'Was wollen Sie mit der Figur?', once: true, say: [['kessler', 'Ausstellen. Wofür sind Museen sonst da.'], ['falk', 'Sie ist nicht katalogisiert, nicht publiziert und nicht schön.'], ['kessler', 'Wir zahlen trotzdem.']] },

<script>
/* Kapitel 2: New York. Straße, Gasse, Garderobe, Bühne. */
(function (ATL) {
  const A = ATL.A;
  const R = ATL.rooms.define;

  function cityNight(ctx) {
    A.sky(ctx, 960, 600, '#0a0d24', '#2a2340');
    A.stars(ctx, 960, 200, 60, 12);
    // Hochhäuser hinten
    const r = ATL.U.rng(21);
    for (let x = -20; x < 980; x += 70 + r() * 60) {
      const h = 140 + r() * 220, w = 60 + r() * 70;
      A.rect(ctx, x, 260 - h, w, h + 60, '#151a30');
      for (let wy = 270 - h; wy < 250; wy += 16) for (let wx = x + 6; wx < x + w - 8; wx += 14) if (r() < 0.35) A.rect(ctx, wx, wy, 7, 9, r() < 0.5 ? '#ffe9a0' : '#c8d8ff');
    }
  }

  // ---------------------------------------------------------------- Straße
  R({
    id: 'ny_street', name: 'Straße vor dem Theater', ambient: 'city',
    start: [200, 520, 'r'],
    walk: [[30, 445, 930, 445, 940, 585, 20, 585]],
    scale: { y0: 430, s0: 0.78, y1: 585, s1: 1.05 },
    paint(ctx, g) {

    if (g.flag('bericht_genommen')) return 'Den Bericht habe ich schon. Fach 7 ist jetzt leer.';

    });
  }

<script>
/* Kapitel 4: Kreta. Fischerdorf, Taverne, Knossos, Pfeilerkrypta, Halle des Stiers. */
(function (ATL) {

    labrys: { title: 'Die Doppelaxt', origin: 'Minoische Kunst; Plutarch, Griechische Fragen 45', text: 'Die Doppelaxt ist eines der häufigsten Zeichen der minoischen Kultur. Sie erscheint als Ritzung auf Pfeilern und Steinblöcken in Knossos, als Weihegeschenk aus Bronze und Gold in Höhlenheiligtümern wie Arkalochori und als Motiv auf Gefäßen und Siegeln. Praktisch benutzbar waren die meisten Weihe-Äxte nicht; ihre Blätter sind zu dünn.\nDas Wort „labrys“ überliefert Plutarch als lydische Bezeichnung für die Axt. Arthur Evans verband es mit dem Namen Labyrinth, „Haus der Doppelaxt“. Die Deutung ist verbreitet, aber nicht bewiesen.' },
    knossos: { title: 'Knossos und Evans', origin: 'Archäologiegeschichte', text: 'Der Palast von Knossos bei Heraklion wurde ab 1900 von Arthur Evans ausgegraben, nachdem der kretische Kaufmann Minos Kalokairinos 1878 erste Magazine mit Pithoi freigelegt hatte. Evans fand ein Gebäude mit Hunderten von Räumen um einen zentralen Hof, Wandmalereien, Tontafeln in Linear A und Linear B und den steinernen Thron im sogenannten Thronsaal.\nEvans ließ Teile des Palastes mit Beton und bemalten Säulen wiederaufbauen. Diese Rekonstruktionen sind bis heute umstritten, weil sie seine Deutung festschreiben. Die „Pfeilerkrypten“ im Westflügel, deren Pfeiler mit Doppeläxten geritzt sind, hielt er für Kulträume.' },
  });

  // Plan lesen: setzt eine Aufgabe, sobald Falk die Anmerkung kennt.

  // Weißes Haus mit blauen Fensterläden

  // Livias Hinweis je nach Stand
  async function liviaHint(g) {
    if (g.has('stiersiegel')) { await deuteSiegel(g); return; }
    if (g.flag('krypta_offen')) {
      if (g.flag('faden')) await g.talk([['livia', 'Der Faden hängt am Ring, sagst du. Dann ist der Rest Laufen. Und der Stier am Ende will etwas, das man ihm gibt, nicht etwas, das man ihm nimmt.'], ['falk', 'Du klingst wie ein Orakel.'], ['livia', 'Ich klinge wie jemand, der die Rhyta im Museum gesehen hat. Trankopfer, Adrian. Man gießt etwas hinein.']]);
      else if (g.has('wolle')) await g.talk([['livia', 'Du hast ein Knäuel. Theseus hat das Ende am Eingang festgebunden, nicht in der Tasche behalten. Das ist der ganze Trick.']]);
      else await g.talk([['livia', 'Da unten ohne Faden? Dann sehen wir uns in einer Woche, wenn du Glück hast.'], ['livia', 'Kyria Eleni in der Taverne strickt seit vierzig Jahren. Sie gibt einem Fremden Wolle, wenn er ihr zuhört. Nur zuhören, Adrian. Nicht dozieren.']]);
      return;
    }
    if (g.flag('plan_gelesen') || g.flag('yannis_legende')) {
      const lines = [['livia', 'Krypta, drei Äxte, die mittlere. Ich würde dem alten Yannis eher glauben als dem Colonel, aber sie sagen dasselbe.']];
      if (!g.has('doppelaxt')) lines.push(['livia', 'Und sieh dir die Magazine an. Evans hat die Pithoi geleert, sagt er. Ich habe noch nie einen Engländer bis auf den Grund eines Vorratskrugs greifen sehen.']);
      await g.talk(lines);
      return;
    }
    if (g.has('plan')) { await g.talk([['livia', 'Der Colonel hat dir seinen Plan gegeben? Dann lies ihn. Er hat dreißig Jahre daran geschrieben, der Rand ist interessanter als die Mitte.']]); return; }
    await g.talk([['livia', 'In der Taverne sitzt ein Engländer, der seit Evans hier ist. Er trinkt, er redet, meistens gleichzeitig. Wenn jemand den Palast kennt, dann er.'], ['livia', 'Und die Ziege vor der Kapelle kaut auf einem Hut, der ihr nicht gehört. Ich sage das nur, weil es dich sonst später ärgert.']]);
  }

  async function deuteSiegel(g) {
    if (g.flag('siegel_gedeutet')) { await g.talk([['livia', 'Der Stier ist in deiner Tasche. Was fehlt, liegt woanders. Gehen wir.']]); return; }
    g.set('siegel_gedeutet');
    await g.talk([
      ['livia', 'Zeig her.'],
      'Falk hält ihr die Bronzescheibe hin. Livia dreht sie um, hält sie ins Licht.',
      ['livia', 'Der Stierkopf, wie auf den Rhyta. Und auf der Rückseite acht Kerben, genau wie beim Siegel der Sonne. Sie sind nicht zum Anschauen da. Sie greifen in etwas ein.'],
      ['falk', 'Ein Schloss. Das Tor unter dem brennenden Berg, sagt die Stele.'],
      ['livia', 'Thera. Drei Ringe, drei Siegel, und Solon hat aufgeschrieben, wie man sie dreht.'],
      ['falk', 'Und Kessler war hier unten. Vesper weiß, wo wir sind.'],
      ['livia', 'Dann sollten wir schneller sein als er.'],
    ]);
    if (g.has('flutsiegel')) { await g.say('livia', 'Sonne, Stier, Flut. Wir haben alle drei. Nach Thera.'); g.objective('Nach Thera reisen. Das Tor unter dem brennenden Berg mit den drei Siegeln öffnen.'); }
    else { await g.say('livia', 'Das Siegel der Flut fehlt noch. Die Weisen aus dem Meer, das Haus des süßen Wassers: Eridu.'); g.objective('Nach Eridu reisen und das Siegel der Flut finden.'); }
  }
