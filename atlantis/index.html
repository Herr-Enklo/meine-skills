<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die Siegel von Atlantis</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="frame">
  <div id="stage">
    <canvas id="scene" width="960" height="600"></canvas>
    <div id="overlay" class="hidden"></div>
    <div id="toast" class="hidden"></div>
    <div id="topbar">
      <button id="btn-diary" title="Tagebuch und Kodex (T)">Tagebuch</button>
      <button id="btn-menu" title="Menü (Esc)">Menü</button>
    </div>
  </div>
  <div id="panel">
    <div id="sentence">&nbsp;</div>
    <div id="controls">
      <div id="verbs">
        <button data-verb="give">Gib</button>
        <button data-verb="open">Öffne</button>
        <button data-verb="close">Schließe</button>
        <button data-verb="take">Nimm</button>
        <button data-verb="look">Schau an</button>
        <button data-verb="talk">Rede mit</button>
        <button data-verb="use">Benutze</button>
        <button data-verb="push">Drücke</button>
        <button data-verb="pull">Ziehe</button>
      </div>
      <div id="inventory">
        <button id="inv-up" class="inv-arrow">▲</button>
        <div id="inv-grid"></div>
        <button id="inv-down" class="inv-arrow">▼</button>
      </div>
      <div id="dialog" class="hidden"></div>
    </div>
  </div>
  <div id="menu" class="hidden">
    <div class="menu-box">
      <h1>Die Siegel von Atlantis</h1>
      <p class="sub">Ein Abenteuer in der klassischen Art</p>
      <div id="menu-buttons"></div>
      <div id="menu-slots" class="hidden"></div>
      <p class="hint">Zeigen und Klicken: Verb wählen, dann Gegenstand anklicken. Rechte Maustaste: Anschauen. Leertaste oder Klick: Text überspringen.</p>
    </div>
  </div>
  <div id="diary" class="hidden">
    <div class="diary-box">
      <div class="diary-tabs">
        <button data-tab="ziele" class="active">Aufgaben</button>
        <button data-tab="kodex">Kodex der Mythen</button>
        <button id="diary-close">Schließen</button>
      </div>
      <div id="diary-content"></div>
    </div>
  </div>
</div>
<script src="js/engine/util.js"></script>
<script src="js/engine/audio.js"></script>
<script src="js/engine/path.js"></script>
<script src="js/engine/actor.js"></script>
<script src="js/engine/fx.js"></script>
<script src="js/art/lib.js"></script>
<script src="js/art/icons.js"></script>
<script src="js/engine/core.js"></script>
<script src="js/engine/dialog.js"></script>
<script src="js/engine/ui.js"></script>
<script src="js/engine/puzzles.js"></script>
<script src="js/data/chars.js"></script>
<script src="js/data/items.js"></script>
<script src="js/data/codex.js"></script>
<script src="js/data/story.js"></script>
<script src="js/data/rooms/map.js"></script>
<script src="js/data/rooms/prolog.js"></script>
<script src="js/data/rooms/newyork.js"></script>
<script src="js/data/rooms/egypt.js"></script>
<script src="js/data/rooms/crete.js"></script>
<script src="js/data/rooms/mesopotamia.js"></script>
<script src="js/data/rooms/thera.js"></script>
<script src="js/data/rooms/atlantis.js"></script>
<script src="js/main.js"></script>
</body>
</html>
